# Daily verifier for the Widen/Acquia DAM URLs used by the ticket kiosk.
# Runs src/data/urlVerifier.js against every row in src/data/DAM_URLs.csv:
#   - fetches the direct-download URL, confirms HTTP 200 + %PDF- magic bytes + filename match
#   - fetches the public share URL, confirms HTTP 200
#   - checks that the local PNG thumbnail exists for the destination
#
# On a failure, emails NOTIFY_EMAIL via Gmail SMTP - but only when the state changed
# (previous scheduled run was not already failing), so a sustained outage emails once,
# not once per day. Manual (workflow_dispatch) runs always email.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   NOTIFY_EMAIL   Recipient address(es) for failure notifications; comma-separate for multiple (e.g. a@x.com,b@y.com)
#   SMTP_USER      Gmail address used to send from (e.g., yourname@gmail.com)
#   SMTP_PASS      Gmail App Password (https://myaccount.google.com/apppasswords - NOT your login password)
#
# If any of the three secrets are unset, the email step is skipped but the workflow still
# fails, so GitHub's built-in workflow-failure notification still reaches the repo owner.

name: Verify DAM URLs

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC daily (~9am ET / 8am CT)
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Force a synthetic failure (tests the notification/email path without touching real data)'
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # needed to read this workflow's previous run conclusion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run DAM URL verifier
        id: verify
        env:
          FORCE_FAIL: ${{ inputs.force_fail }}
        run: |
          if [ "$FORCE_FAIL" = "true" ]; then
            echo "::warning::force_fail=true - simulating a verifier failure to test the notification path"
            echo "  FAIL simulated-destination"
            echo "         - synthetic failure triggered by workflow_dispatch input"
            echo ""
            echo "=== SUMMARY: 0 ok, 1 failed (simulated) ==="
            {
              echo "failures<<DAM_EOF"
              echo "- simulated-destination:"
              echo "    synthetic failure triggered by workflow_dispatch input"
              echo "DAM_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          node src/data/urlVerifier.js

      - name: Check notification setup
        if: failure() && steps.verify.conclusion == 'failure'
        id: notify_setup
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -z "$NOTIFY_EMAIL" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Email skipped - one of NOTIFY_EMAIL, SMTP_USER, SMTP_PASS is unset."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Only email on a state transition (OK -> FAIL), not once per day while it stays broken.
      # The previous scheduled run's conclusion is our state - no artifact/cache to expire.
      - name: Decide whether to notify
        if: failure() && steps.verify.conclusion == 'failure'
        id: transition
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          # Manual/dispatch runs (incl. force_fail test) always notify.
          if [ "$EVENT" != "schedule" ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Non-scheduled run - notifying regardless of previous state."
            exit 0
          fi
          prev=$(gh api "/repos/$REPO/actions/workflows/verify-dam-urls.yml/runs?event=schedule&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')
          echo "previous scheduled run conclusion: $prev"
          if [ "$prev" = "failure" ]; then
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Still failing since the previous scheduled run - suppressing duplicate email."
          else
            echo "notify=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Email on failure
        if: failure() && steps.notify_setup.outputs.ready == 'true' && steps.transition.outputs.notify == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: DAM Verifier <${{ secrets.SMTP_USER }}>
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: '[DAM verifier] ${{ github.repository }} run #${{ github.run_number }} failed'
          body: |
            The scheduled DAM URL verifier detected broken links.

            Repository: ${{ github.repository }}
            Run:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit:     ${{ github.sha }}
            Ref:        ${{ github.ref }}

            Failing links:
            ${{ steps.verify.outputs.failures }}

            See the run logs for the full output.
