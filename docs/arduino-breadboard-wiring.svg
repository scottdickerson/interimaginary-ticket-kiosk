<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Arduino UNO breadboard wiring (horizontal rails)</title>
  <desc id="desc">Real breadboard with horizontal GND and power rails. D7 yellow print LED, D8 red error LED, D10 blue error button. GND from POWER header only.</desc>

  <rect width="980" height="620" fill="#f1f5f9"/>

  <!-- Arduino (left) -->
  <rect x="28" y="100" width="220" height="340" rx="10" fill="#0f766e" stroke="#115e59" stroke-width="2"/>
  <text x="138" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ecfdf5">Arduino UNO</text>
  <text x="138" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#a7f3d0">+ StandardFirmata</text>

  <rect x="48" y="58" width="180" height="28" rx="4" fill="#1e293b"/>
  <text x="138" y="77" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#f8fafc">USB to PC (server.js)</text>

  <!-- POWER header -->
  <rect x="42" y="280" width="88" height="92" rx="6" fill="#115e59" stroke="#5eead4" stroke-width="1.5"/>
  <text x="86" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#99f6e4">POWER</text>
  <circle cx="62" cy="328" r="5" fill="#dc2626"/>
  <text x="74" y="332" font-family="Courier New, monospace" font-size="12" fill="#fecaca">5V</text>
  <circle id="power-gnd" cx="62" cy="355" r="7" fill="#111827" stroke="#f8fafc" stroke-width="2"/>
  <text x="74" y="360" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#f8fafc">GND</text>

  <!-- DIGITAL header -->
  <rect x="210" y="160" width="28" height="200" rx="3" fill="#134e4a"/>
  <text x="224" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#99f6e4">DGTL</text>

  <circle id="pin-d7" cx="224" cy="205" r="7" fill="#eab308" stroke="#000" stroke-width="1"/>
  <text x="200" y="209" text-anchor="end" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#fef08a">D7</text>
  <text x="200" y="222" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ccfbf1">PRINT</text>

  <circle id="pin-d8" cx="224" cy="260" r="7" fill="#ef4444" stroke="#000" stroke-width="1"/>
  <text x="200" y="264" text-anchor="end" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#fecaca">D8</text>
  <text x="200" y="277" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ccfbf1">LIGHT</text>

  <circle id="pin-d10" cx="224" cy="320" r="7" fill="#0ea5e9" stroke="#000" stroke-width="1"/>
  <text x="200" y="324" text-anchor="end" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#bae6fd">D10</text>
  <text x="200" y="337" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ccfbf1">ERROR</text>

  <!-- ========== REAL BREADBOARD: horizontal body + horizontal rails ========== -->
  <!-- Outer plastic -->
  <rect x="300" y="80" width="640" height="380" rx="10" fill="#f1e7d0" stroke="#a8a29e" stroke-width="2"/>

  <!-- TOP power rails (horizontal) - optional / labeled but unused for this bench -->
  <rect x="320" y="96" width="600" height="14" rx="2" fill="#fecaca" stroke="#b91c1c"/>
  <text x="330" y="107" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#7f1d1d">+  (horizontal top rail - unused here)</text>
  <rect x="320" y="114" width="600" height="14" rx="2" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="330" y="125" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#1e3a8a">-  (horizontal top rail - unused here)</text>

  <!-- Center channel (clip for DIP ICs) -->
  <rect x="320" y="250" width="600" height="28" rx="2" fill="#d6d3d1"/>

  <!-- Tie-point grid (suggests columns vertical, rows horizontal like real BB) -->
  <g opacity="0.45">
    <!-- upper half rows of holes -->
    <g fill="#57534e">
      <circle cx="360" cy="160" r="2"/><circle cx="380" cy="160" r="2"/><circle cx="400" cy="160" r="2"/><circle cx="420" cy="160" r="2"/><circle cx="440" cy="160" r="2"/>
      <circle cx="360" cy="180" r="2"/><circle cx="380" cy="180" r="2"/><circle cx="400" cy="180" r="2"/><circle cx="420" cy="180" r="2"/><circle cx="440" cy="180" r="2"/>
      <circle cx="360" cy="200" r="2"/><circle cx="380" cy="200" r="2"/><circle cx="400" cy="200" r="2"/><circle cx="420" cy="200" r="2"/><circle cx="440" cy="200" r="2"/>
      <circle cx="520" cy="160" r="2"/><circle cx="540" cy="160" r="2"/><circle cx="560" cy="160" r="2"/><circle cx="580" cy="160" r="2"/><circle cx="600" cy="160" r="2"/>
      <circle cx="520" cy="180" r="2"/><circle cx="540" cy="180" r="2"/><circle cx="560" cy="180" r="2"/><circle cx="580" cy="180" r="2"/><circle cx="600" cy="180" r="2"/>
      <circle cx="680" cy="160" r="2"/><circle cx="700" cy="160" r="2"/><circle cx="720" cy="160" r="2"/><circle cx="740" cy="160" r="2"/><circle cx="760" cy="160" r="2"/>
      <circle cx="680" cy="180" r="2"/><circle cx="700" cy="180" r="2"/><circle cx="720" cy="180" r="2"/><circle cx="740" cy="180" r="2"/><circle cx="760" cy="180" r="2"/>
      <!-- lower half -->
      <circle cx="360" cy="310" r="2"/><circle cx="380" cy="310" r="2"/><circle cx="400" cy="310" r="2"/><circle cx="420" cy="310" r="2"/><circle cx="440" cy="310" r="2"/>
      <circle cx="360" cy="330" r="2"/><circle cx="380" cy="330" r="2"/><circle cx="400" cy="330" r="2"/><circle cx="420" cy="330" r="2"/><circle cx="440" cy="330" r="2"/>
      <circle cx="520" cy="310" r="2"/><circle cx="540" cy="310" r="2"/><circle cx="560" cy="310" r="2"/><circle cx="580" cy="310" r="2"/><circle cx="600" cy="310" r="2"/>
      <circle cx="520" cy="330" r="2"/><circle cx="540" cy="330" r="2"/><circle cx="560" cy="330" r="2"/><circle cx="580" cy="330" r="2"/><circle cx="600" cy="330" r="2"/>
      <circle cx="680" cy="310" r="2"/><circle cx="700" cy="310" r="2"/><circle cx="720" cy="310" r="2"/><circle cx="740" cy="310" r="2"/><circle cx="760" cy="310" r="2"/>
      <circle cx="680" cy="330" r="2"/><circle cx="700" cy="330" r="2"/><circle cx="720" cy="330" r="2"/><circle cx="740" cy="330" r="2"/><circle cx="760" cy="330" r="2"/>
    </g>
  </g>

  <!-- BOTTOM horizontal rails (used) -->
  <rect x="320" y="390" width="600" height="16" rx="2" fill="#fecaca" stroke="#b91c1c"/>
  <text x="330" y="402" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#7f1d1d">+  5V horizontal rail (unused on this bench)</text>
  <rect id="gnd-rail" x="320" y="412" width="600" height="20" rx="2" fill="#111827" stroke="#0f172a"/>
  <text x="330" y="426" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#f8fafc">-  GND horizontal rail  (all grounds plug into this row)</text>
  <!-- rail pin dots (horizontal) -->
  <g fill="#e2e8f0">
    <circle cx="700" cy="422" r="2.5"/><circle cx="720" cy="422" r="2.5"/><circle cx="740" cy="422" r="2.5"/><circle cx="760" cy="422" r="2.5"/><circle cx="780" cy="422" r="2.5"/><circle cx="800" cy="422" r="2.5"/>
  </g>

  <text x="620" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#44403c">Breadboard (rails run left-right)</text>

  <!-- Components sitting in tie-point area -->
  <!-- Print LED (green) left side upper -->
  <circle cx="400" cy="180" r="16" fill="#22c55e" stroke="#166534" stroke-width="2"/>
  <text x="400" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#052e16">LED</text>
  <rect x="430" y="172" width="28" height="12" rx="2" fill="#fde68a" stroke="#b45309"/>
  <text x="444" y="182" text-anchor="middle" font-family="Courier New, monospace" font-size="8" fill="#78350f">R</text>
  <text x="400" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#166534">Print switch</text>
  <text x="400" y="230" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#57534e">D7 to R to LED to GND</text>

  <!-- Error LED (red) center upper-ish lower of channel? keep upper for clarity - place mid-right upper -->
  <circle cx="580" cy="180" r="16" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <text x="580" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#450a0a">LED</text>
  <rect x="610" y="172" width="28" height="12" rx="2" fill="#fde68a" stroke="#b45309"/>
  <text x="624" y="182" text-anchor="middle" font-family="Courier New, monospace" font-size="8" fill="#78350f">R</text>
  <text x="580" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#991b1b">Error light</text>
  <text x="580" y="230" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#57534e">D8 to R to LED to GND</text>

  <!-- Button lower half -->
  <rect x="700" y="300" width="96" height="48" rx="8" fill="#0ea5e9" stroke="#0369a1" stroke-width="2"/>
  <circle cx="726" cy="324" r="6" fill="#e0f2fe"/>
  <circle cx="770" cy="324" r="6" fill="#e0f2fe"/>
  <text x="748" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#0c4a6e">Printer error btn</text>
  <text x="748" y="385" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#57534e">D10 to btn to GND</text>

  <!-- Wires: D7 yellow from pin to LED/R -->
  <path d="M 231 205 H 300 V 180 H 384" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 416 180 H 430" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
  <!-- cathode of print LED down to horizontal GND rail -->
  <path d="M 400 196 V 422" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>

  <!-- Wires: D8 red -->
  <path d="M 231 260 H 290 V 180 H 564" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 596 180 H 610" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <path d="M 580 196 V 422" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>

  <!-- Wires: D10 blue -->
  <path d="M 231 320 H 300 V 324 H 700" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 796 324 V 422" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>

  <!-- POWER GND to horizontal bottom GND rail -->
  <path d="M 62 362 V 480 H 320 V 422" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="100" y="468" width="150" height="22" rx="3" fill="#fef08a" stroke="#ca8a04"/>
  <text x="175" y="483" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#422006">POWER GND -> bottom rail</text>

  <!-- Legend -->
  <rect x="28" y="510" width="924" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a">How a real breadboard is oriented</text>
  <text x="48" y="558" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">Power and ground rails run horizontally along the top and bottom of the board (left-right), not as vertical strips on the sides.</text>
  <text x="48" y="578" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">D7 yellow = print LED. D8 red = error LED. D10 blue = button. Plug all ground legs into the bottom horizontal GND rail. Long LED lead = anode toward Arduino pin.</text>
</svg>
